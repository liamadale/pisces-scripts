{% for r in rows %}
<tr data-ip="{{ r.ip }}" onclick="handleDnsResolverRowClick(this)" style="cursor:pointer">
  <td><span style="font-weight:600">{{ r.ip }}</span></td>
  <td style="font-size:0.82rem">{% if r.org_icon %}<i class="{{ r.org_icon }} org-icon org-{{ r.org_category }}" title="{{ r.provider }}"></i>{% endif %}{{ r.provider }}</td>
  <td>{{ r.name }}</td>
  <td class="num">{{ r.ticket_count }}</td>
  <td>{{ r.first_seen or '—' }}</td>
  <td>{{ r.last_seen or '—' }}</td>
</tr>
{% else %}
<tr class="loading-row"><td colspan="6">No results.</td></tr>
{% endfor %}
{# Hidden pagination meta row — read by JS afterSwap listener #}
<tr id="dns-resolver-pager-meta"
    data-total="{{ total }}"
    data-page="{{ page }}"
    data-per-page="{{ per_page }}"
    data-total-pages="{{ total_pages }}"
    style="display:none" aria-hidden="true"></tr>
