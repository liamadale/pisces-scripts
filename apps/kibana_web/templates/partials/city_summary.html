{% if not buckets %}
<p class="ss-empty">No cities found in the selected time range.</p>
{% else %}
{% set max_count = buckets[0].doc_count %}
<div class="ss-meta">
  {{ buckets|length }} city/sensor(s) &middot;
  <button class="ss-link" onclick="citySelectAll(true)">all</button> /
  <button class="ss-link" onclick="citySelectAll(false)">none</button>
</div>
<div class="ss-list">
  {% for b in buckets %}
  <label class="ss-row">
    <input type="checkbox" class="ss-check" value="{{ b.key }}"
           {% if b.key in current_cities %}checked{% endif %}>
    <span class="ss-name" title="{{ b.key }}">{{ b.key }}</span>
    <span class="ss-count">{{ "{:,}".format(b.doc_count) }}</span>
    <span class="ss-bar-wrap">
      <span class="ss-bar-fill"
            style="width:{{ (b.doc_count / max_count * 100)|round(1) }}%"></span>
    </span>
  </label>
  {% endfor %}
</div>
<div class="ss-footer">
  <button class="btn btn-primary" onclick="applyCitySelection()">
    <i class="fa-solid fa-check"></i> Apply
  </button>
</div>
{% endif %}
