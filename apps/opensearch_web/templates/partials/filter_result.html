{% if success %}
<div id="filter-zone-{{ idx }}" class="detail-card">
  <div class="enrich-col-header" style="color: var(--green)">
    <i class="fa-solid fa-circle-check"></i> Filter added
  </div>
  <p style="font-size:0.82rem;">
    Appended to <code>filters/{{ category }}/{{ subcategory }}.yaml</code>
  </p>
  <p style="font-size:0.82rem; color:var(--text-dim); margin-top:4px;">
    Restart the server (or flush the filter cache) to apply.
  </p>
</div>
{% else %}
<div id="filter-zone-{{ idx }}" class="detail-card">
  <div class="enrich-col-header" style="color: var(--red)">
    <i class="fa-solid fa-triangle-exclamation"></i> Could not create filter
  </div>
  <p style="font-size:0.82rem; color:var(--red)">{{ error }}</p>
  <button class="btn btn-sm" style="margin-top:8px"
          onclick="document.getElementById('filter-zone-{{ idx }}').innerHTML=''">
    Dismiss
  </button>
</div>
{% endif %}
