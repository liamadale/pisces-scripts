{% if not buckets %}
<p class="ns-empty">No Suricata alert records in the selected time range.</p>
{% else %}
{% set max_count = buckets[-1].doc_count %}
<div class="ns-meta">{{ buckets|length }} distinct rule(s) · rarest first</div>
{% for b in buckets %}
<div class="ns-row" role="button" tabindex="0"
     onclick='applySuricataFilter({{ b.key|tojson }})'
     onkeydown='if(event.key==="Enter"||event.key===" ")applySuricataFilter({{ b.key|tojson }})'>
  <span class="ns-name">{{ b.key }}</span>
  <span class="ns-count">{{ "{:,}".format(b.doc_count) }}</span>
  <span class="ns-bar-wrap">
    <span class="ns-bar-fill"
          style="width:{{ (b.doc_count / max_count * 100)|round(1) }}%"></span>
  </span>
</div>
{% endfor %}
{% endif %}
