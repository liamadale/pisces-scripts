<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PISCES · OpenSearch{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='pisces-logo.ico') }}">
  <script>
    /* Apply saved theme before CSS loads to prevent flash */
    (function() {
      var t = localStorage.getItem('pisces-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='pisces.css') }}">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">
  <script>window.SCRIPT_NAME = {{ script_name | tojson }};</script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body>

<div id="app-shell">

  <!-- ── Left Sidebar ─────────────────────────────────────── -->
  <aside id="sidebar">

    <!-- Brand -->
    <a class="sidebar-brand" href="{{ script_name }}/">
      <img src="{{ url_for('static', filename='pisces-logo.png') }}" class="brand-logo" alt="PISCES">
      <span class="sidebar-label">PISCES <span class="brand-sub">OpenSearch</span></span>
    </a>

    <!-- Hub link (only when mounted under a script name) -->
    {% if script_name %}
    <a href="/" class="sidebar-link sidebar-hub" title="Hub">
      <i class="fa-solid fa-house"></i>
      <span class="sidebar-label">Hub</span>
    </a>
    {% endif %}

    <!-- Protocol groups -->
    {% for cat in category_order %}
    <div class="sidebar-group" data-category="{{ cat }}">
      <button class="group-hdr" data-cat="{{ cat }}" title="{{ category_labels[cat] }}">
        <i class="fa-solid {{ category_icons[cat] }}"></i>
        <span class="sidebar-label">{{ category_labels[cat] }}</span>
        <i class="fa-solid fa-chevron-right toggle-icon sidebar-label"></i>
      </button>
      <div class="group-links">
        {% for lt in modules_by_category[cat] %}
        <a href="{{ script_name }}/log/{{ lt }}"
           class="sidebar-link{% if request.path.endswith('/log/' ~ lt) %} active{% endif %}"
           title="{{ lt }}">
          <i class="fa-solid {{ proto_icons.get(lt, 'fa-file-lines') }}"></i>
          <span class="sidebar-label">{{ lt }}</span>
        </a>
        {% endfor %}
      </div>
    </div>
    {% endfor %}

    <!-- Footer: theme toggle + collapse -->
    <div class="sidebar-foot">
      <button class="sidebar-link btn-theme" onclick="toggleTheme()" title="Toggle theme">
        <i class="fa-solid fa-moon" id="theme-icon"></i>
        <span class="sidebar-label">Theme</span>
      </button>
      <button class="sidebar-link sidebar-collapse-btn" onclick="toggleSidebar()" title="Collapse sidebar">
        <i class="fa-solid fa-chevron-left" id="sidebar-collapse-icon"></i>
        <span class="sidebar-label">Collapse</span>
      </button>
    </div>

  </aside><!-- /#sidebar -->

  <!-- ── Content area ─────────────────────────────────────── -->
  <div id="content-area">
    <div id="htmx-bar"></div>

    {# Global search controls — persisted across pages via form GET #}
    <form class="search-bar" method="GET" action="{{ script_name }}{{ request.path }}" id="global-search">
      <label>Time</label>
      <select name="time_range" onchange="localStorage.setItem('pisces-time-range', this.value); this.form.submit()">
        {% for tr in TIME_RANGES %}
        <option value="{{ tr }}" {% if request.values.get('time_range', 'now-24h') == tr %}selected{% endif %}>
          {{ tr.replace('now-', '') }}
        </option>
        {% endfor %}
      </select>

      <div class="sep"></div>

      <label>Sensor</label>
      <input type="text" name="sensor" id="sensor-input"
             value="{{ request.values.get('sensor', 'all') }}"
             placeholder="all">
      <button type="button" class="btn-icon"
              onclick="openSensorModal()"
              title="Browse sensors">
        <i class="fa-solid fa-list-check"></i>
      </button>

      <div class="sep"></div>

      <label>Src IP</label>
      <input type="text" name="src_ip"
             value="{{ request.values.get('src_ip', '') }}"
             placeholder="any">

      <div class="sep"></div>

      <label>Direction</label>
      <select name="direction">
        <option value="" {% if not request.values.get('direction') %}selected{% endif %}>any</option>
        {% for d in ['inbound', 'outbound', 'internal', 'external'] %}
        <option value="{{ d }}" {% if request.values.get('direction') == d %}selected{% endif %}>{{ d }}</option>
        {% endfor %}
      </select>

      <div class="sep"></div>

      <label class="check-label">
        <input type="checkbox" name="public_only" value="on"
               {% if request.values.get('public_only') in ('on', 'true', '1') %}checked{% endif %}>
        Public&nbsp;only
      </label>

      <div class="sep"></div>

      <label>Limit</label>
      <input type="number" name="limit" min="1" max="10000"
             value="{{ request.values.get('limit', '500') }}"
             placeholder="500">

      <div class="sep"></div>

      <label>Min Risk</label>
      <input type="number" name="min_risk" min="1" max="100"
             value="{{ request.values.get('min_risk', '') }}"
             placeholder="off">

      <div class="sep"></div>

      <button type="submit" class="btn btn-primary">
        <i class="fa-solid fa-magnifying-glass"></i> Search
      </button>
    </form>

    <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
    </main>

  </div><!-- /#content-area -->

</div><!-- /#app-shell -->

<!-- Sensor browser modal -->
<div id="sensor-modal-backdrop" class="modal-backdrop"
     onclick="if(event.target===this)closeSensorModal()"></div>
<div id="sensor-modal" class="modal-panel" role="dialog" aria-modal="true" aria-label="Sensor browser">
  <div class="modal-header">
    <span class="modal-title"><i class="fa-solid fa-satellite-dish"></i> Browse Sensors</span>
    <button class="btn-icon" onclick="closeSensorModal()">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>
  <div id="sensor-modal-body" class="modal-body" style="padding:12px;">
    <p class="ss-empty">Loading&hellip;</p>
  </div>
</div>

<!-- Sidebar tooltip (shown via JS when sidebar is collapsed) -->
<div id="sidebar-tooltip"></div>

<!-- Record detail slide-in panel -->
<aside id="detail-panel" class="detail-panel-slide" aria-label="Record detail">
  <div class="detail-panel-resize" id="detail-panel-resize" title="Drag to resize"></div>
  <div id="detail-panel-content"></div>
</aside>

<script>
(function () {
  /* ── Theme toggle ────────────────────────────────────── */
  window.toggleTheme = function() {
    var html = document.documentElement;
    var current = html.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('pisces-theme', next);
    updateThemeIcon(next);
  };

  function updateThemeIcon(theme) {
    var icon = document.getElementById('theme-icon');
    if (!icon) return;
    if (theme === 'dark') {
      icon.classList.remove('fa-sun');
      icon.classList.add('fa-moon');
    } else {
      icon.classList.remove('fa-moon');
      icon.classList.add('fa-sun');
    }
  }

  updateThemeIcon(document.documentElement.getAttribute('data-theme') || 'dark');

  /* ── Sortable table ─────────────────────────────────── */
  function sortTable(th) {
    var table = th.closest("table");
    var tbody = table.querySelector("tbody");
    // Use data-sort-col (two-row header) or fall back to position in parent row
    var col = th.dataset.sortCol !== undefined
      ? parseInt(th.dataset.sortCol, 10)
      : Array.from(th.parentElement.children).indexOf(th);
    var asc = th.classList.toggle("sort-asc");
    if (!asc) th.classList.add("sort-desc"); else th.classList.remove("sort-desc");
    table.querySelectorAll("thead th").forEach(function(t) {
      if (t !== th) t.classList.remove("sort-asc", "sort-desc");
    });
    var rows = Array.from(tbody.querySelectorAll("tr"));
    rows.sort(function(a, b) {
      var av = a.children[col] ? (a.children[col].dataset.val || a.children[col].textContent.trim()) : "";
      var bv = b.children[col] ? (b.children[col].dataset.val || b.children[col].textContent.trim()) : "";
      var an = parseFloat(av), bn = parseFloat(bv);
      if (!isNaN(an) && !isNaN(bn)) return asc ? an - bn : bn - an;
      return asc ? av.localeCompare(bv) : bv.localeCompare(av);
    });
    rows.forEach(function(r) { tbody.appendChild(r); });
  }

  /* ── Detail panel ───────────────────────────────────── */
  function openDetailPanel() {
    document.getElementById("detail-panel").classList.add("open");
  }

  window.closeDetailPanel = function() {
    document.getElementById("detail-panel").classList.remove("open");
    document.querySelectorAll("tr.row-selected").forEach(function(r) {
      r.classList.remove("row-selected");
    });
  };

  window.handleDetailToggle = function(el) {
    var row = el.tagName === "TR" ? el : el.closest("tr");
    var isSelected = row.classList.contains("row-selected");
    document.querySelectorAll("tr.row-selected").forEach(function(r) {
      r.classList.remove("row-selected");
    });
    if (isSelected) {
      closeDetailPanel();
    } else {
      row.classList.add("row-selected");
    }
  };

  /* ── Detail panel resize ────────────────────────────── */
  (function() {
    var STORAGE_KEY = 'detailPanelWidth';
    var MIN_WIDTH   = 280;
    var MAX_FRAC    = 0.92;
    var panel       = document.getElementById('detail-panel');
    var handle      = document.getElementById('detail-panel-resize');

    function applyWidth(px) {
      var max = Math.floor(window.innerWidth * MAX_FRAC);
      px = Math.max(MIN_WIDTH, Math.min(px, max));
      panel.style.width = px + 'px';
      return px;
    }

    var saved = parseInt(localStorage.getItem(STORAGE_KEY), 10);
    if (!isNaN(saved)) applyWidth(saved);

    handle.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      handle.classList.add('dragging');
      panel.style.transition = 'none';
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'ew-resize';

      function onMove(ev) {
        applyWidth(window.innerWidth - ev.clientX);
      }
      function onUp() {
        handle.classList.remove('dragging');
        panel.style.transition = '';
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
        var w = parseInt(panel.style.width, 10);
        if (!isNaN(w)) localStorage.setItem(STORAGE_KEY, w);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  })();

  /* ── Resizable columns ──────────────────────────────── */
  function initResizableColumns(table) {
    if (table.classList.contains("no-resize")) return;
    var cols = Array.from(table.querySelectorAll("col"));
    // Only use the last thead row so multi-row headers don't add duplicate handles
    var headRows = Array.from(table.querySelectorAll("thead tr"));
    var lastRow  = headRows[headRows.length - 1];
    var allThs   = Array.from(lastRow.querySelectorAll("th"));

    allThs.forEach(function(th, i) {
      if (th.querySelector(".resize-handle")) return;
      if (i === allThs.length - 1) return;
      // Skip spanning or group-toggle cells
      if (parseInt(th.getAttribute("colspan") || "1", 10) > 1) return;

      var handle = document.createElement("div");
      handle.className = "resize-handle";
      th.appendChild(handle);

      handle.addEventListener("mousedown", function(e) {
        e.preventDefault();
        e.stopPropagation();

        if (!table._colsLocked) {
          var thWidths = allThs.map(function(t) { return t.offsetWidth; });
          table.style.tableLayout = "fixed";
          allThs.forEach(function(t, j) {
            if (cols[j]) cols[j].style.width = thWidths[j] + "px";
            else t.style.width = thWidths[j] + "px";
          });
          table._colsLocked = true;
        }

        var startX   = e.clientX;
        var startW   = th.offsetWidth;
        var nextTh   = allThs[i + 1];
        var startNextW = nextTh.offsetWidth;
        var col      = cols[i];
        var nextCol  = cols[i + 1];

        handle.classList.add("dragging");
        document.body.style.cursor = "col-resize";

        function onMove(ev) {
          var delta   = Math.min(startW - 40, Math.max(-(startNextW - 40), ev.clientX - startX));
          var newW     = startW     + delta;
          var newNextW = startNextW - delta;
          if (col)     col.style.width     = newW     + "px";
          else         th.style.width      = newW     + "px";
          if (nextCol) nextCol.style.width = newNextW + "px";
          else         nextTh.style.width  = newNextW + "px";
        }
        function onUp() {
          handle.classList.remove("dragging");
          document.body.style.cursor = "";
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onUp);
        }
        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
      });
    });
  }

  document.querySelectorAll("table").forEach(initResizableColumns);

  /* ── Global event delegation ────────────────────────── */
  document.addEventListener("click", function(e) {
    if (e.target.closest(".resize-handle")) return;
    var th = e.target.closest("th.sortable");
    if (th) { sortTable(th); return; }

    var panel = document.getElementById("detail-panel");
    if (panel && panel.classList.contains("open")) {
      if (!panel.contains(e.target) && !e.target.closest("tbody tr")) {
        closeDetailPanel();
      }
    }
  });

  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") { closeDetailPanel(); closeSensorModal(); }
  });

  /* ── Sensor browser modal ────────────────────────────── */
  window.openSensorModal = function() {
    if (!document.querySelector('#sensor-modal-body .ss-list')) {
      htmx.ajax('GET', '/api/sensor/summary' + window.location.search,
                {target: '#sensor-modal-body', swap: 'innerHTML'});
    }
    document.getElementById('sensor-modal-backdrop').classList.add('open');
    document.getElementById('sensor-modal').classList.add('open');
  };
  window.closeSensorModal = function() {
    document.getElementById('sensor-modal-backdrop').classList.remove('open');
    document.getElementById('sensor-modal').classList.remove('open');
  };
  window.sensorSelectAll = function(state) {
    document.querySelectorAll('#sensor-modal-body .ss-check')
      .forEach(function(cb) { cb.checked = state; });
  };
  window.applySensorSelection = function() {
    var checked = Array.from(
      document.querySelectorAll('#sensor-modal-body .ss-check:checked')
    ).map(function(cb) { return cb.value; });
    var input = document.getElementById('sensor-input');
    input.value = checked.length ? checked.join(',') : 'all';
    closeSensorModal();
    document.getElementById('global-search').submit();
  };

  /* ── Sticky search params (time_range + sensor) ─────── */
  (function() {
    var params = new URLSearchParams(window.location.search);
    var changed = false;

    if (params.has('sensor')) {
      var sv = params.get('sensor');
      if (sv && sv.toLowerCase() !== 'all') {
        localStorage.setItem('pisces-sensor', sv);
      } else {
        localStorage.removeItem('pisces-sensor');
      }
    } else {
      var savedSensor = localStorage.getItem('pisces-sensor');
      if (savedSensor) { params.set('sensor', savedSensor); changed = true; }
    }

    if (!params.has('time_range')) {
      var savedTR = localStorage.getItem('pisces-time-range');
      if (savedTR) { params.set('time_range', savedTR); changed = true; }
    }

    if (changed) window.location.replace(window.location.pathname + '?' + params.toString());
  })();

  document.addEventListener("htmx:afterSwap", function(e) {
    if (e.detail.target && e.detail.target.id === "detail-panel-content") {
      openDetailPanel();
    }
  });

  /* ── HTMX SCRIPT_NAME prefix (hub mode) ─────────────── */
  document.body.addEventListener('htmx:configRequest', function(evt) {
    if (window.SCRIPT_NAME && evt.detail.path.startsWith('/')) {
      evt.detail.path = window.SCRIPT_NAME + evt.detail.path;
    }
  });

  /* ── Global HTMX progress bar ───────────────────────── */
  (function() {
    var bar = document.getElementById("htmx-bar");
    var pending = 0;

    function barStart() {
      pending++;
      bar.classList.remove("htmx-bar-done");
      bar.classList.add("htmx-bar-active");
    }
    function barDone() {
      pending = Math.max(0, pending - 1);
      if (pending === 0) {
        bar.classList.remove("htmx-bar-active");
        bar.classList.add("htmx-bar-done");
        setTimeout(function() { bar.classList.remove("htmx-bar-done"); }, 400);
      }
    }

    document.addEventListener("htmx:beforeRequest", barStart);
    document.addEventListener("htmx:afterRequest", barDone);

    window.addEventListener("beforeunload", barStart);
  })();

  /* ── Sidebar group collapse ──────────────────────────── */
  document.querySelectorAll('.group-hdr').forEach(function(hdr) {
    var cat   = hdr.dataset.cat;
    var links = hdr.nextElementSibling;  /* .group-links */
    var key   = 'pisces-group-' + cat;

    /* Restore state — default: all groups open */
    var closed = localStorage.getItem(key) === 'closed';
    if (closed) links.classList.add('closed');
    else         hdr.classList.add('open');

    hdr.addEventListener('click', function() {
      var isClosed = links.classList.toggle('closed');
      hdr.classList.toggle('open', !isClosed);
      localStorage.setItem(key, isClosed ? 'closed' : 'open');
    });
  });

  /* ── Sidebar collapse toggle ─────────────────────────── */
  window.toggleSidebar = function() {
    var sidebar = document.getElementById('sidebar');
    var icon    = document.getElementById('sidebar-collapse-icon');
    var collapsed = sidebar.classList.toggle('collapsed');
    icon.classList.toggle('fa-chevron-left',  !collapsed);
    icon.classList.toggle('fa-chevron-right', collapsed);
    localStorage.setItem('pisces-sidebar-collapsed', collapsed ? '1' : '');
  };

  /* Restore sidebar state on load */
  (function() {
    if (localStorage.getItem('pisces-sidebar-collapsed') === '1') {
      var sidebar = document.getElementById('sidebar');
      var icon    = document.getElementById('sidebar-collapse-icon');
      if (sidebar) sidebar.classList.add('collapsed');
      if (icon)    { icon.classList.remove('fa-chevron-left');
                     icon.classList.add('fa-chevron-right'); }
    }
  })();

  /* ── Sidebar tooltip (collapsed mode) ───────────────── */
  (function() {
    var tip     = document.getElementById('sidebar-tooltip');
    var sidebar = document.getElementById('sidebar');
    if (!tip || !sidebar) return;

    function showTip(el) {
      if (!sidebar.classList.contains('collapsed')) return;
      var labelEl = el.querySelector('.sidebar-label');
      var text = labelEl ? labelEl.textContent.trim() : (el.getAttribute('title') || '');
      if (!text) return;
      var rect = el.getBoundingClientRect();
      tip.textContent = text;
      tip.style.top  = (rect.top + rect.height / 2) + 'px';
      tip.style.display = 'block';
    }
    function hideTip() { tip.style.display = 'none'; }

    sidebar.querySelectorAll('.sidebar-link, .group-hdr').forEach(function(el) {
      el.addEventListener('mouseenter', function() { showTip(el); });
      el.addEventListener('mouseleave', hideTip);
    });
    sidebar.addEventListener('mouseleave', hideTip);
  })();

})();
</script>

</body>
</html>
