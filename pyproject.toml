[project]
name = "pisces-scripts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "beautifulsoup4>=4.12.0",
    "flask>=3.0",
]

[project.optional-dependencies]
# AI assistant integration via MCP servers (Claude Code, Claude Desktop, kiro-cli)
mcp = ["mcp[cli]>=1.0.0"]

# ML-based ticket classifier (Layer 2 in mantis_index.py --use-ml)
ml = ["scikit-learn>=1.3", "joblib>=1.3"]

# Everything
all = [
    "mcp[cli]>=1.0.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]
