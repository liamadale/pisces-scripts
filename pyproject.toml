[project]
name = "pisces-scripts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "beautifulsoup4>=4.12.0",
    "flask>=3.0",
    "geoip2>=4.8.0",
]

[project.optional-dependencies]
# AI assistant integration via MCP servers (Claude Code, Claude Desktop, kiro-cli)
mcp = ["mcp[cli]>=1.0.0"]

# NLP-enhanced ticket classification (spaCy dependency parsing, NER)
nlp = [
    "spacy>=3.7",
]

# Offline ASN/BGP reputation lookup (requires a BGP dump at data/asn_table.dat)
# Download a dump via: python -m pyasn.scripts.pyasn_util_download
offline-enrichment = [
    "pyasn>=1.6.1",
]

# Everything
all = [
    "mcp[cli]>=1.0.0",
    "spacy>=3.7",
    "pyasn>=1.6.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]
